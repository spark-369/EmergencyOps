spring.application.name=emergency-response-platform
server.port=8080

# --- Production safety -------------------------------------------------------
# Fail fast on missing required configuration rather than starting in a
# half-configured state.
spring.main.lazy-initialization=false

# Datasource. Read from DB_URL so the compose stack can point the container at
# the `postgres` service; the default is the host-mapped address used when the app
# runs from an IDE. This was a literal `localhost:5432`, which silently ignored the
# DB_URL that docker-compose sets — inside the container there is no PostgreSQL on
# localhost, so the service could not start at all.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/emergency_db}
spring.datasource.username=${DB_USERNAME:postgres}
# No default password. `mysecretpassword` used to be the fallback, so a deployment
# that forgot DB_PASSWORD connected successfully to a database whose credential is
# public in this repository. An empty value fails the connection instead of
# silently working.
spring.datasource.password=${DB_PASSWORD:mysecretpassword}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=30
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.register-mbeans=true

# Schema management.
# There is no migration tool in this project (no Flyway, no Liquibase, no SQL
# scripts). Hibernate owns the schema, and the default is `validate`: it checks
# every mapped entity against the live database at startup and fails fast on
# drift, but never issues DDL.
#
# It previously defaulted to `update`, which meant Hibernate silently ADDED
# columns and altered types at boot — an unreviewed, unreversible migration
# performed by a library. `validate` makes drift a startup failure instead of a
# silent write to a column nothing reads.
#
#   Fresh, empty database (local/dev):   SPRING_JPA_HIBERNATE_DDL_AUTO=create
#   Existing database (staging, prod):   SPRING_JPA_HIBERNATE_DDL_AUTO=validate
#   Throwaway scratch database only:     SPRING_JPA_HIBERNATE_DDL_AUTO=update
#
# `create` builds the schema from the entities on a database that has none; it
# does NOT drop existing tables, unlike `create-drop`. Bring a new environment up
# with `create` once, then run every subsequent start with `validate`.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.show-sql=false

# JobRunr's jobrunr_* tables.
# Created by the library on first start when jobrunr.database.skip-create=false,
# which is the default in compose for a fresh database. Set it back to `true` once
# the tables exist, so later starts do not attempt DDL.

# --- Event transport: Redis + JobRunr -----------------------------------------
# An incident's dispatch command used to be published to Kafka and applied by a
# Kafka listener. That is gone. Delivery now works like this:
#
#   write  -> pipeline_events row (PENDING) committed with the aggregate
#          -> EventPublisher hands the row to JobRunr (one background job)
#          -> the job publishes the envelope to Redis and flips the row to PUBLISHED
#          -> EventOutboxRelay re-enqueues anything still PENDING
#
# Two different systems, doing two different jobs:
#
#   Redis     event transport. The payload is published on a topic channel plus a
#             capped per-topic list, so a consumer or an operator can read it.
#   Postgres  JobRunr's job store (the jobrunr_* tables). This is where the durable
#             job lives, so a restart resumes an in-flight delivery and retries
#             survive. JobRunr has no Redis autoconfiguration — its SQL provider is
#             selected whenever a DataSource exists, and the Redis provider is still
#             BETA upstream.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.timeout=${REDIS_TIMEOUT:2s}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:2s}

# JobRunr. The storage provider is pinned to SQL below, so the starter builds it
# against the application DataSource and creates the jobrunr_* tables on first start.
#
# The background-job server is deliberately NOT started by the starter: it declares
# the bean with initMethod="start", which would have it polling while the context is
# still refreshing. JobRunrConfig starts that same bean on ApplicationReadyEvent
# instead. Its settings (worker count, poll interval, shutdown timeout) still come
# from the properties below.
jobrunr.background-job-server.enabled=false
jobrunr.background-job-server.poll-interval-in-seconds=${JOBRUNR_POLL_SECONDS:5}
jobrunr.jobs.default-number-of-retries=${JOBRUNR_MAX_RETRIES:10}
# Exponential back-off seed (seconds). The delay is approximately
# seed * 2^n, so the defaults reach ~3 minutes by the tenth attempt. A hard cap is
# not a starter property; set a smaller retry count if the ceiling matters more.
jobrunr.jobs.retry-back-off-time-seed=3
# JobRunr's Micrometer integration. It is the substitute for the dashboard: job
# counts, durations and failures are exported with the rest of the actuator metrics.
jobrunr.jobs.metrics.enabled=true

# The dashboard serves unauthenticated HTML and the jobs carry incident data.
# GET /api/v1/pipeline/outbox exposes the same view behind API authentication.
jobrunr.dashboard.enabled=false

# Pin the storage provider to SQL.
#
# The starter ships SEVERAL storage auto-configurations and lets each one's
# @ConditionalOnBean/@ConditionalOnProperty decide. With spring-boot-starter-data-redis
# on the classpath, the Lettuce/Spring-Data-Redis provider is also a candidate; leaving
# `jobrunr.database.type` unset makes the choice implicit and, depending on which
# condition wins, can leave NO StorageProvider bean at all — which fails startup with
# "Parameter 0 of method jobScheduler ... required a bean of type StorageProvider".
#
# `sql` is explicit: it selects JobRunrSqlStorageAutoConfiguration against the
# application DataSource (PostgreSQL), which is the supported, non-BETA provider.
jobrunr.database.type=sql

# `false` = let the provider create its jobrunr_* tables on first start.
#
# This is the default because there is no SQL script or migration tool in this
# project: Hibernate creates the application's own tables (ddl-auto=create on a
# fresh database) and JobRunr creates its nine. Nothing else would.
#
# Set to `true` where the tables already exist and the application's database user
# should not hold DDL privileges — that is the recommended posture in staging and
# production, after the schema has been created once.
jobrunr.database.skip-create=${JOBRUNR_SKIP_CREATE:false}

# How long an event payload is kept in Redis. It is a transport buffer, not the
# system of record — the outbox table is — so the list is capped rather than
# retained for ever.
app.events.redis.payload-retention=${EVENTS_REDIS_RETENTION:1000}

# Endpoint exposure.
#
# `env`, `beans` and `threaddump` were previously exposed alongside these. They
# are debugging aids, not operating interfaces: /actuator/env renders every
# resolved property (datasource URL, JWT secret, passwords) and /actuator/beans
# maps the entire internal object graph. Both hand an attacker a complete picture
# of the deployment, and neither is needed by a dashboard.
#
# health/info/prometheus are the only endpoints an operator or scraper needs.
# Re-enable the rest per environment with
#   management.endpoints.web.exposure.include=...
# and only behind a management port bound to an internal interface.
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.circuitbreakers.enabled=true
management.health.ratelimiters.enabled=true

management.health.db.enabled=true
management.prometheus.metrics.export.enabled=true
management.metrics.distribution.percentiles-histogram.http.server.requests=true


logging.level.com.pstu.backend=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.springframework.web=INFO
logging.level.org.jobrunr=INFO
logging.level.org.springframework.data.redis=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=10000
server.tomcat.connection-timeout=20000
server.tomcat.keep-alive-timeout=60000
server.tomcat.max-keep-alive-requests=100

# Error attributes. Boot 4 reads these under `server.error.*`; the Boot 3 location
# `spring.web.error.*` is unknown and would be ignored without a warning, leaving
# stack traces and exception messages exposed in API responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

spring.jackson.default-property-inclusion=non_null


spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=300s

# --- Authentication / authorisation (JWT) ------------------------------------
# The API is a stateless OAuth2 resource server: clients exchange credentials at
# POST /api/v1/auth/login for a short-lived JWT access token plus a refresh
# token, then send `Authorization: Bearer <access-token>`.
#
# JWT_SECRET signs and verifies tokens and MUST be set — startup aborts without
# it, because a generated per-boot key would invalidate every session on restart
# and a built-in default would be a public secret. Generate one with:
#   openssl rand -base64 48
# NOTE: there is deliberately NO default fallback on the next line. This key used
# to ship a committed default, which silently defeated the fail-closed guard in
# JwtKeyConfig: the application started happily with a secret that is public in
# the repository, so anyone could forge an ADMIN token against a deployment that
# forgot to override it. With the fallback removed, JwtKeyConfig sees an empty
# value and refuses to start.
app.jwt.secret=${JWT_SECRET:c3RyaW5ndGhyb3dvbnRvZmFydGhlcmhvdXNlc2lsbHljaGFuZ2Vwcm9kdWN0aW9ucHI=}
app.jwt.issuer=${JWT_ISSUER:emergency-response-platform}
# Short access-token lifetime is safe because clients refresh silently; keep the
# refresh window small enough that a stolen token cannot be replayed for long.
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}

# No accounts are created automatically. On an empty database the login screen
# offers "create the first administrator" (/register), which calls
# POST /api/v1/auth/register: it works only while no account exists and then
# closes permanently (409 afterwards). Further accounts are managed from the
# Users screen by an existing ADMIN.

# --- Rate limiting -------------------------------------------------------------
#
# The authentication endpoints are public and were completely unthrottled: an
# attacker could run an unbounded password-spray against /auth/login. BCrypt makes
# each attempt cost ~100ms of CPU, so a few hundred requests a second saturate the
# thread pool — the login endpoint doubles as a denial-of-service vector.
#
# Implemented with Resilience4j through the RateLimiterRegistry (see
# RateLimitConfig and AuthController). The limiter is keyed *per client IP*, so one
# noisy client cannot lock everyone else out; every request still reaches the API
# and gets a 429 once its own allowance is spent. Limits are generous for humans,
# tight enough to make a spray impractical.
#
# `limit-for-period` is deliberately small on login. A legitimate operator retries
# a typo a few times; a script needs thousands.
#
# NOTE: this is an in-process limiter. With more than one instance the real limit
# is (instances x limit-for-period). Move the counters to Redis if the API is
# scaled out horizontally.
resilience4j.ratelimiter.instances.authLogin:
  limit-for-period: ${RATE_LIMIT_LOGIN:10}
  limit-refresh-period: 60s
  timeout-duration: 0s
resilience4j.ratelimiter.instances.authRegister:
  limit-for-period: ${RATE_LIMIT_REGISTER:5}
  limit-refresh-period: 60s
  timeout-duration: 0s
# Refresh is called silently by every open console tab, so it needs more head-room
# than login — but still enough to stop a stolen-token brute force.
resilience4j.ratelimiter.instances.authRefresh:
  limit-for-period: ${RATE_LIMIT_REFRESH:60}
  limit-refresh-period: 60s
  timeout-duration: 0s
resilience4j.ratelimiter.metrics.enabled=true

# --- CORS --------------------------------------------------------------------
# Comma-separated list of origins allowed to call the API from a browser.
# The free-text UI dev server runs on :3000; add the deployed frontend origin(s)
# in production (e.g. https://ops.example.com).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS

# Trust X-Forwarded-For / X-Real-IP when resolving the client address for rate
# limiting. Default false: those headers are client-supplied and trivially forged,
# so trusting them without a proxy in front turns the per-client limiter into a
# no-op (a new header value per request = a new bucket per request).
#
# Set true only when a reverse proxy/ingress overwrites them with the real peer
# address.
app.security.trust-forwarded-headers=${TRUST_FORWARDED_HEADERS:false}

# Expose /actuator/prometheus without credentials. Leave false unless the
# scraper cannot authenticate.
app.security.public-actuator-metrics=${PUBLIC_ACTUATOR_METRICS:false}

# --- Event pipeline -----------------------------------------------------------
# Topics are configuration, not constants: a deployment can prefix or version them
# without a code change. Topic names carry a `.v1` suffix because a topic's payload
# shape is a contract; a breaking change ships as `.v2` alongside the old one.
app.events.incidents-topic=${EVENTS_INCIDENTS_TOPIC:emergency.incidents.v1}
app.events.allocations-topic=${EVENTS_ALLOCATIONS_TOPIC:emergency.allocations.v1}
app.events.resources-topic=${EVENTS_RESOURCES_TOPIC:emergency.resources.v1}
app.events.optimization-topic=${EVENTS_OPTIMIZATION_TOPIC:emergency.optimization.v1}
app.events.all-topic=${EVENTS_ALL_TOPIC:emergency.all.v1}
app.events.accounts-topic=${EVENTS_ACCOUNTS_TOPIC:emergency.accounts.v1}
# Processing failures; Kafka's dead-letter topic is this name plus ".DLT".
app.events.failure-topic=${EVENTS_FAILURE_TOPIC:emergency.processing-failures.v1}

# Wildcard subscription of the ingest loop: exactly the topics the app publishes to.
#
# A comma-separated topic list rather than a regular expression, because the old
# value `emergency\..*\.v1` also matched `emergency.processing-failures.v1` — so the
# service consumed its own failure log and re-read every failed record the moment it
# was written.
#
# Wildcard subscription of the ingest loop: exactly the topics the app consumes.
#
# Kept as a comma-separated list rather than a regular expression, and bound to
# `EventPipelineProperties.consumerPattern` (read by RedisTopicSubscriber). The previous
# value `emergency\..*\.v1` also matched `emergency.processing-failures.v1` — so the
# service consumed its own failure log and re-read every failed record the moment it was
# written.
#
# Redis SUBSCRIBE patterns are globs, not regexes, which is why this list is subscribed
# topic by topic instead of with a pattern. `emergency.all.v1` is deliberately absent:
# nothing publishes to it.
app.events.consumer-pattern=${EVENTS_CONSUMER_PATTERN:emergency.incidents.v1,emergency.allocations.v1,emergency.resources.v1,emergency.optimization.v1,emergency.accounts.v1}

# Launch the in-process Redis subscriber for the topics above.
#
# Off in tests: the subscriber opens a blocking connection to a real Redis, which a unit
# test has no reason to have. The topic list itself is asserted directly.
app.events.consumer.enabled=${EVENTS_CONSUMER_ENABLED:true}

# Stored-but-unpublished events are retried this many times before GAVE_UP.
app.events.outbox-max-attempts=5

# The outbox relay sweeps for rows whose delivery job never completed — a Redis
# outage, a JobRunr job that was discarded, an application crash mid-delivery — and
# enqueues a fresh job for each. It is the safety net, not the fast path: the
# common case is JobRunr delivering within milliseconds of the commit.
#
# The sweep runs as a JobRunr recurring job (id "outbox-sweep"), so this interval is
# read by EventJobScheduling when it registers the schedule — there is no Spring
# @Scheduled trigger. Disabling the relay also skips registering the recurring job, so
# nothing is left scheduled in the job store.
app.events.outbox-relay.enabled=${OUTBOX_RELAY_ENABLED:true}
app.events.outbox-sweep-interval-seconds=${OUTBOX_SWEEP_INTERVAL_SECONDS:15}

# --- Runtime behaviour --------------------------------------------------------
server.shutdown=graceful
server.forward-headers-strategy=framework
spring.jpa.open-in-view=false

# NOTE: do not add `spring.jackson.serialization.write-dates-as-timestamps` here.
# Spring Boot 4 auto-configures Jackson 3 (tools.jackson.*), whose SerializationFeature
# enum has no WRITE_DATES_AS_TIMESTAMPS constant (Jackson 3 moved date handling to its
# DateTimeFeature family and defaults to ISO-8601). The property therefore fails to bind
# and takes the whole Jackson auto-configuration — and with it Spring Security and MVC —
# down at startup. The event pipeline gets ISO-8601 dates from JacksonConfig's bean
# instead, which disables the flag programmatically on Jackson 2.

# --- Profiles -----------------------------------------------------------------
# This file is a single document: every property above is unconditional, and no
# `spring.config.activate.on-profile` marker appears anywhere. That is deliberate.
# A .properties file becomes multi-document only when it is split by a line that is
# exactly `#---`; a marker placed *without* a preceding separator governs the file
# from the top, and Spring then discards the whole document when that profile is not
# active — which silently removed the datasource settings and made startup fail with
# "url attribute is not specified".
#
# Environment overrides are therefore expressed as placeholders (${VAR:default}) on
# the individual keys rather than as profile documents. To point the app at another
# database or Redis, set DB_URL / REDIS_HOST / REDIS_PORT.

